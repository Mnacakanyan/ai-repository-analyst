[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-repo-analyst"
version = "1.0.0"
description = "Autonomous AI Agent with Official MCP Integration for GitHub Architecture Analysis and Quality Audits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "AI Engineering Applicant" }
]
dependencies = [
    "anthropic>=0.30.0",
    "openai>=1.30.0",
    "mcp>=1.0.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
repo-analyst = "repo_analyst.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
